    value: 4500.0
    units: m/s
    status: ASSUMED
    severity: hard
    source: "placeholder chemical propulsion limit without relativistic accelerator enabler (~4.5 km/s)"
  reaction_mass_resupply_kg:
    value: 1.0e+12
    units: kg
    status: ASSUMED
    severity: hard
    source: "placeholder closed-system reaction-mass resupply baseline limit (1e12 kg)"
