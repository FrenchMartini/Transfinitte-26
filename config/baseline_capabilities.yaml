# Baseline capabilities without declared hypothetical enablers.
#
# These entries represent reference technological/civilizational baselines
# relaxed by declared hypothetical enablers in config/hypothetical_enablers.yaml.

power:
  beam_power_w:
    value: 2.0e+13
    units: W
    status: ASSUMED
    severity: hard
    source: "placeholder terrestrial total power ceiling without off-world enablers (~20 TW)"

propulsion:
