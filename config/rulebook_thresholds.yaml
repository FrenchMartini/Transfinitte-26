# ==============================================================================
# Octo-Earth / OrbitShift Rulebook & Appendix Thresholds
# ==============================================================================
# CENTRAL RULE: Every organizer rulebook/appendix limit lives in this file.
# Benchmark reference values and tolerances live in results/reference.json.
# Paste the real appendix values here when available and change status to CONFIRMED.
#
# Every entry MUST have all five fields:
#   value:    numeric or boolean threshold
#   units:    physical unit string
#   status:   ASSUMED | CONFIRMED
#   severity: hard | flag
#   source:   reference or placeholder note
# ==============================================================================

simulation:
