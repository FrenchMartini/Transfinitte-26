# OrbitShift rulebook limits and planetary physical safety thresholds.
#
# Threshold governance and audit contracts:
# - Central repository for all organizer, planetary habitability, and structural limits.
# - Status: ASSUMED (unconfirmed placeholder) or CONFIRMED (official rulebook value).
# - Severity: hard (causes immediate simulation failure) or flag (tracked in FlagRegistry).
# - Benchmark values and tolerances live strictly in results/reference.json.

simulation:
  max_years:
    value: 10000
    units: years
    status: CONFIRMED
    severity: hard
    source: "PARTICIPANT_GUIDE.pdf Page 3 Winning Condition 1: Earth reaches its target orbit within 10,000 simulated years"

structure:
  min_safety_factor:
    value: 1.5
    units: dimensionless
    status: CONFIRMED
    severity: hard
    source: "PARTICIPANT_GUIDE.pdf Page 3 Winning Condition 3: Every structural safety factor >= 1.5"

