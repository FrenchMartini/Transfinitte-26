# Declared hypothetical enablers relaxing rulebook limits (Rulebook Section 7).
#
# Constraints and schema rules:
# - At most 3 declared enablers allowed across the entire mission.
# - Each entry specifies id, name, relaxes (threshold keys), value (with units), efficiency, justification, and sources.
# - Any raised flag in FlagRegistry not attributed to a declared enabler fails the run.

enablers:
  - id: "E1"
    name: "Near-Sun Beamed Power Link (power)"
    relaxes:
      - "power.beam_power_w"
    value: 1.6e+25
    units: "W"
    efficiency: "1.00 (coherent phased-array power transmission sized to 1.6e25 W peak controller demand)"
    justification: "Near-Sun Dyson swarm collector capturing ~4.16% L_sun and beaming up to 1.6e25 W peak power to the standoff tug via coherent laser/microwave array to support nominal 1.085e25 W jet power plus transient station-keeping control authority."
    sources:
      - "team estimate (Dyson swarm ~4.16% solar luminosity collector at 0.05 AU sized for peak controller demand)"
      - "docs/specification.md Section 2"

  - id: "E2"
    name: "Asteroid Relocation & Mining Pipeline (asteroid and material)"
    relaxes:
      - "propulsion.reaction_mass_resupply_kg"
    value: 1.6911e+21
    units: "kg"
    efficiency: "1.00 (continuous automated belt mass resupply pipeline)"
    justification: "Relocation of Ceres-class asteroid (9.4e20 kg) to Earth standoff position plus continuous automated reaction-mass extraction pipeline supplying 7.511e20 kg propellant (1.6911e21 kg total asteroid material)."
    sources:
      - "team estimate (automated asteroid-belt continuous reaction-mass pipeline and Ceres tug relocation)"
      - "docs/feasibility_corrections.md Section 5"

  - id: "E3"
    name: "Relativistic Plasma Exhaust Accelerator (exhaust accelerator)"
    relaxes:
      - "propulsion.max_exhaust_velocity_m_s"
    value: 89937737.4
    units: "m/s"
    efficiency: "0.99 (magnetic nozzle and relativistic ion accelerator)"
    justification: "0.3c relativistic ion/plasma accelerator driving 2.501e9 kg/s reaction mass at Lorentz gamma = 1.0483."
    sources:
      - "team estimate (0.3c relativistic magnetoplasmadynamic / ion accelerator)"
      - "docs/specification.md Section 2"
