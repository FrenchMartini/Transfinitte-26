# ==============================================================================
# Octo-Earth Base Run Configuration (ARCHITECTURE.md Section 9)
# ==============================================================================
mode: "averaged"
time_span_years: 10000.0
macro_step_s: 86400.0

integrator:
  rtol: 1.0e-12
  atol: 1.0e-9

drivers:
  - "power"
  - "propulsion"
  - "orbit"
  - "structure"
  - "habitability"

propulsion:
  variant: "ceres_gravity_tug"
  exhaust_velocity_m_s: 89937737.4  # 0.3c
  mass_flow_kg_s: 2.3e9
  power_w: 1.0e25
  efficiency: 1.0

ceres_tug:
  mass_kg: 9.4e20
  exhaust_velocity_m_s: 89937737.4  # 0.3c
  beam_power_w: 1.0e25
  cone_half_angle_deg: 5.0
  waste_heat_fraction: 0.01  # ASSUMED
  standoff_distance_m: 6.84e8  # d = sqrt(G * M_tug / a_earth)
  standoff_tolerance_m: 1.0e7
  station_keeping_kp: 1.0e-5
  station_keeping_kd: 1.0e-2

initial_conditions:
  semi_major_axis_au: 1.0
  eccentricity: 0.0
  inclination_rad: 0.0

target_orbit:
  semi_major_axis_au: 2.7
  eccentricity: 0.0

test_probe:
  mass_kg: 1000.0
  exhaust_velocity_m_s: 50000.0

seed: 42

output_paths:
  parquet: "results/run_0001.parquet"
  replay: "results/run_0001.octo"
  report: "results/validation_report.json"
