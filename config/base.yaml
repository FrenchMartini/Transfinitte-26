# ==============================================================================
# Octo-Earth Base Run Configuration (ARCHITECTURE.md Section 9)
# ==============================================================================
mode: "averaged"
time_span_years: 10000.0
macro_step_s: 86400.0

integrator:
  rtol: 1.0e-12
  atol: 1.0e-9

drivers:
  - "power"
  - "propulsion"
  - "orbit"
  - "structure"
  - "habitability"

propulsion:
  variant: "zero_thrust_stub"
  exhaust_velocity_m_s: 0.0
  mass_flow_kg_s: 0.0
  power_w: 0.0
  efficiency: 1.0

initial_conditions:
  semi_major_axis_au: 1.0
  eccentricity: 0.0
  inclination_rad: 0.0

target_orbit:
  semi_major_axis_au: 2.7
  eccentricity: 0.0

seed: 42

output_paths:
  parquet: "results/run_0001.parquet"
  replay: "results/run_0001.octo"
  report: "results/validation_report.json"
