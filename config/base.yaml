# Primary simulation run configuration for OrbitShift Ceres Gravity Tug.
#
# Key parameters and architecture contracts:
# - Run mode: Averaged secular spiral transfer (10,000-year time span).
# - Propulsion: Relativistic Ceres Gravity Tug with 0.3c exhaust velocity.
# - Nominal thrust calibrated for 9,500-year arrival at 2.7 AU with cant and yaw trim.
# - Constant Tug mass: Maintained via continuous reaction-mass resupply from asteroid belt.
# - Equilibrium standoff: d = sqrt(G * M_tug / a_earth) = 1.2701e9 m.
# - Numerical integration: Macro-step Strang splitting with IAS15 N-body orbital propagation.
mode: "averaged"
time_span_years: 10000.0
macro_step_s: 86400.0

integrator:
  rtol: 1.0e-12
  atol: 1.0e-9

drivers:
  - "power"
  - "propulsion"
  - "orbit"
  - "structure"
  - "habitability"

propulsion:
  variant: "ceres_gravity_tug"
  exhaust_velocity_m_s: 89937737.4  # 0.3c
  mass_flow_kg_s: 2.501e9  # Calibrated for 9,500 yr arrival with cant and yaw trim
  power_w: 1.085e25
  efficiency: 1.0

ceres_tug:
  mass_kg: 9.4e20  # Constant mass via continuous asteroid-belt resupply
  exhaust_velocity_m_s: 89937737.4  # 0.3c
  beam_power_w: 1.085e25  # Reconciled nominal steady-state beam power matching jet kinetic power (1.085e25 W)
  peak_beam_power_w: 1.6e25  # Reconciled with E1 capacity to support 1.58e25 W peak station-keeping controller transients
  cone_half_angle_deg: 5.0
  waste_heat_fraction: 0.01  # ASSUMED
  standoff_distance_m: 1.2701e9  # Equilibrium standoff d = sqrt(G * M_tug / a_earth)
  standoff_tolerance_m: 1.0e7
  station_keeping_kp: 1.0e-5
  station_keeping_kd: 1.0e-2
  balance_tolerance_rel: 0.05
  reduced_model_validation_tol: 0.01  # ASSUMED: 1% agreement target

reduced_model_validation_tol: 0.01  # ASSUMED: 1% agreement target

climate_mirror:
  active: true
  area_m2: 8.44e14  # Geometric collector area at L1 to maintain nominal insolation out to 2.7 AU
  reflectivity: 0.95
  mass_kg: 1.0e11   # Lightweight gossamer reflective membrane
  position: "L1"    # Positioned at Earth-Sun L1 sub-solar point
  orientation_deg: 0.0  # Normal aligned with Sun-Earth axis
  capture_efficiency: 1.0  # ASSUMED: Fraction of reflected flux intercepting Earth cross section
  throttle_by_deficit: true  # Modulate mirror aperture/reflection to match solar deficit as orbit expands
  station_keeping_type: "statite_photon_trim"  # Propellantless solar tacking via electrochromic edge panels
  trim_authority_margin: 0.25  # > 0.15 margin to maintain displaced non-Keplerian equilibrium sunward of L1
  dual_swarm: true  # L1 Day Concentrator Swarm + L2 Night Halo Swarm
  l2_halo_radius_km: 14000.0  # Halo orbit clearing Earth shadow cone
  l2_night_flux_fraction: 0.35  # Reverse Earthshine night-side flux fraction preventing hyper-canes

initial_conditions:
  semi_major_axis_au: 1.0
  eccentricity: 0.0
  inclination_rad: 0.0

target_orbit:
  semi_major_axis_au: 2.7
  eccentricity: 0.0

test_probe:
  mass_kg: 1000.0
  exhaust_velocity_m_s: 50000.0

seed: 42

output_paths:
  simulation: "results/simulation.json"
  plot: "results/spiral_trajectory.png"
  acceptance_report: "reports/final_acceptance_report.md"
